[package]
name = "zj-sysinfo"
version = "0.1.0"
edition = "2021"

[dependencies]
getrandom = "0.2"
zellij-tile = "0.44.3"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "0.11"

[[bin]]
name = "zj-sysinfo"
path = "src/main.rs"
test = false

[profile.release]
opt-level = "s"
lto = true
strip = true
